# 웹 버전(PWA)을 Cloudflare Workers(정적 자산)에 배포한다 — https://jumpprogrammer.app
# main 에 푸시하면 실행되고, Actions 탭에서 직접 실행할 수도 있다. 설정 방법은 docs/WEB.md 참고.
#   - Secrets  CONTENT_DEPLOY_KEY : 비공개 콘텐츠 저장소(lgm1007/to-jump-content)의 읽기 전용 배포 키(SSH 개인 키)
#   - Secrets  CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID : Cloudflare 배포용 ("Edit Cloudflare Workers" 토큰)
#   - Variables(선택) ADSENSE_CLIENT · ADSENSE_SLOT : Google AdSense 게시자 ID(ca-pub-…) · 광고 단위 ID
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치면 먼저 시작한 배포를 끝까지 진행한다
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jumpprogrammer.app
    env:
      TJ_CONTENT_DIR: ${{ github.workspace }}/.content
    steps:
      - uses: actions/checkout@v7

      - name: 비공개 콘텐츠 받기
        uses: actions/checkout@v7
        with:
          repository: lgm1007/to-jump-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: .content
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 전체 콘텐츠로 맞추기
        run: |
          npm run content:sync
          node scripts/content-sync.mjs --require-full

      - run: npm test

      - name: 웹 빌드 (도메인 루트)
        run: npm run build:web
        env:
          TJ_WEB_ORIGIN: https://jumpprogrammer.app
          EXPO_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          EXPO_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}

      - name: Cloudflare 배포
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.142.0'
          command: deploy
